<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Repair lookup: Control plane vs Data plane</title>
  <desc id="svgDesc">Flow from Repair Web and Repair API through Repair EDC Control Plane, DSP to DPP EDC Control Plane and Gaia-X compliance, then HttpData-PULL through DPP Data Plane to DPP API.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <filter id="cardSh" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrV" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="url(#pageBg)"/>

  <text x="490" y="32" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Hanover Ski Passport: request flow</text>
  <text x="490" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Control plane first (catalog, negotiate, Gaia-X), then data plane (EDR, pull, proxy)</text>

  <rect x="24" y="72" width="140" height="26" rx="6" fill="#1e293b"/>
  <text x="94" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">1. Repair shop</text>
  <rect x="330" y="72" width="320" height="26" rx="6" fill="#0f766e"/>
  <text x="490" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">2. Control plane (DSP + Gaia-X policy)</text>
  <rect x="690" y="72" width="266" height="26" rx="6" fill="#5b21b6"/>
  <text x="823" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">3. Data plane (HttpData-PULL)</text>

  <g filter="url(#cardSh)">
    <rect x="40" y="118" width="200" height="56" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="140" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Repair Shop Web</text>
    <text x="140" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Next.js / repair-ui</text>
  </g>
  <g filter="url(#cardSh)">
    <rect x="40" y="198" width="200" height="78" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="140" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Repair Shop API</text>
    <text x="140" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">FastAPI / repair-api</text>
    <text x="140" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Orchestrates EDC via Management API</text>
  </g>

  <g filter="url(#cardSh)">
    <rect x="600" y="118" width="200" height="68" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <text x="700" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">DPP API</text>
    <text x="700" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Passport data / dpp-api</text>
    <text x="700" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Self-seeds asset + policy on CP</text>
  </g>

  <g filter="url(#cardSh)">
    <rect x="300" y="198" width="210" height="92" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <text x="405" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Repair EDC Control Plane</text>
    <text x="405" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">DSP client, negotiation (consumer)</text>
    <text x="405" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">repair-edc-cp, DID Web + traces</text>
    <text x="405" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0f766e">:9191 management, :9292 DSP</text>
  </g>
  <g filter="url(#cardSh)">
    <rect x="600" y="198" width="200" height="92" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">DPP EDC Control Plane</text>
    <text x="700" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Catalog, offers, provider negotiation</text>
    <text x="700" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">dpp-edc-cp, Gaia-X policy function</text>
    <text x="700" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">Extension calls gx-compliance</text>
  </g>

  <g filter="url(#cardSh)">
    <rect x="300" y="318" width="210" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="405" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134e4a">Repair EDC Data Plane</text>
    <text x="405" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">repair-edc-dp (consumer connector)</text>
  </g>
  <line x1="405" y1="290" x2="405" y2="318" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr)"/>

  <g filter="url(#cardSh)">
    <rect x="530" y="318" width="270" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="665" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#9a3412">Gaia-X Compliance</text>
    <text x="665" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57534e">gx-compliance, VP-JWT verification</text>
    <text x="665" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">Called from DPP CP during policy eval</text>
  </g>

  <line x1="32" y1="428" x2="948" y2="428" stroke="#cbd5e1" stroke-width="1"/>
  <text x="490" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6">After contract finalized: EDR + HttpData-PULL (same repair-api process)</text>

  <g filter="url(#cardSh)">
    <rect x="40" y="448" width="180" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="130" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">Repair API</text>
    <text x="130" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b21a8">HTTP GET with EDR token</text>
  </g>
  <g filter="url(#cardSh)">
    <rect x="300" y="448" width="200" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="400" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">DPP EDC Data Plane</text>
    <text x="400" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b21a8">dpp-edc-dp: validate token, proxy</text>
  </g>
  <g filter="url(#cardSh)">
    <rect x="560" y="448" width="200" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="660" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">DPP API</text>
    <text x="660" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b21a8">Returns passport JSON</text>
  </g>

  <line x1="140" y1="174" x2="140" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="154" cy="184" r="11" fill="#1e293b"/>
  <text x="154" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">1</text>

  <path d="M 240 237 L 288 237" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="256" y="228" font-family="system-ui, sans-serif" font-size="9" fill="#475569">mgmt</text>
  <circle cx="268" cy="237" r="11" fill="#1e293b"/>
  <text x="268" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">2</text>

  <line x1="700" y1="186" x2="700" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="708" y="196" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">seed</text>

  <path d="M 510 244 L 592 244" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="520" y="236" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0f766e">DSP</text>
  <text x="548" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">catalog / negotiate</text>
  <circle cx="551" cy="244" r="11" fill="#0f766e"/>
  <text x="551" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">3</text>

  <line x1="700" y1="290" x2="665" y2="318" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="688" y="302" font-family="system-ui, sans-serif" font-size="9" fill="#c2410c">VP verify</text>
  <circle cx="682" cy="306" r="11" fill="#ea580c"/>
  <text x="682" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">4</text>

  <path d="M 220 480 L 292 480" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrV)"/>
  <text x="232" y="472" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">HttpData-PULL</text>
  <circle cx="256" cy="480" r="11" fill="#5b21b6"/>
  <text x="256" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">5</text>

  <path d="M 500 480 L 552 480" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrV)"/>
  <text x="512" y="472" font-family="system-ui, sans-serif" font-size="9" fill="#6b21a8">proxy</text>
  <circle cx="526" cy="480" r="11" fill="#5b21b6"/>
  <text x="526" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff">6</text>

  <rect x="40" y="532" width="900" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="490" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Caddy: repair.* | dpp.* | edc-repair-shop.* | edc-dpp.* | traces.* | compliance.*</text>
  <text x="490" y="574" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6366f1">Traces: docs/trace-observability.html (full guide, HTML)</text>
</svg>
